name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clickgui-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install latest Gradle
        run: |
          GRADLE_VERSION=$(curl -s https://services.gradle.org/versions/current | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "Installing Gradle $GRADLE_VERSION"
          wget -q https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip
          unzip -q gradle-$GRADLE_VERSION-bin.zip -d /opt
          echo "/opt/gradle-$GRADLE_VERSION/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: clickgui-mod-jar
          path: clickgui-mod/build/libs/*.jar
